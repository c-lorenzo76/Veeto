name: Deploy

on:
  push:
    branches:
      - main
      - uat
      - develop
      - 'feature/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev1'
        type: choice
        options:
          - dev1
          - dev
          - uat
          - prod

env:
  REGISTRY_NAME: vetoacr
  IMAGE_NAME: veto-server

permissions:
  id-token: write
  contents: read

jobs:
  determine-env:
    name: Determine environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy: ${{ steps.set-env.outputs.deploy }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "environment=uat" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" =~ ^refs/heads/feature/ || "${{ github.ref }}" =~ ^refs/heads/.* ]]; then
            echo "environment=dev1" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ needs.determine-env.outputs.environment }}
    runs-on: ubuntu-latest
    needs: determine-env
    if: needs.determine-env.outputs.deploy == 'true'
    environment:
      name: ${{ needs.determine-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      # Azure login via OIDC
      - uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Get secrets from Key Vault
      - name: Get secrets from Key Vault
        id: keyvault
        run: |
          ENV=${{ needs.determine-env.outputs.environment }}
          VAULT_NAME="veto-${ENV}-kv"

          SECRET_KEY=$(az keyvault secret show --vault-name $VAULT_NAME --name SECRET-KEY --query value -o tsv)
          echo "::add-mask::$SECRET_KEY"
          echo "secret_key=$SECRET_KEY" >> $GITHUB_OUTPUT

          CLIENT_ORIGIN=$(az keyvault secret show --vault-name $VAULT_NAME --name CLIENT-ORIGIN --query value -o tsv)
          echo "client_origin=$CLIENT_ORIGIN" >> $GITHUB_OUTPUT

      # Build and push server Docker image
      - name: Build and push server image
        run: |
          ENV=${{ needs.determine-env.outputs.environment }}
          REGISTRY_LOGIN_SERVER="${{ env.REGISTRY_NAME }}.azurecr.io"

          az acr login --name ${{ env.REGISTRY_NAME }}

          docker build -t $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${ENV}-${{ github.sha }} \
                       -t $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${ENV}-latest \
                       -f Dockerfile .

          docker push $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${ENV}-${{ github.sha }}
          docker push $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${ENV}-latest

      # Deploy server to Container App
      - name: Deploy server to Container App
        id: containerapp
        run: |
          ENV=${{ needs.determine-env.outputs.environment }}
          REGISTRY_LOGIN_SERVER="${{ env.REGISTRY_NAME }}.azurecr.io"
          RESOURCE_GROUP="veto-${ENV}"
          CONTAINER_APP="veto-server-${ENV}"

          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY_LOGIN_SERVER/$IMAGE_NAME:${ENV}-${{ github.sha }} \
            --set-env-vars "SECRET_KEY=${{ steps.keyvault.outputs.secret_key }}" \
                           "CLIENT_ORIGIN=${{ steps.keyvault.outputs.client_origin }}" \
                           "NODE_ENV=$([ "$ENV" = "prod" ] && echo production || echo development)"

          FQDN=$(az containerapp show --name $CONTAINER_APP --resource-group $RESOURCE_GROUP --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> $GITHUB_OUTPUT

      # Build client
      - name: Build client
        run: |
          cd client
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: https://${{ steps.containerapp.outputs.fqdn }}

      # Deploy client to Static Web App
      - name: Deploy client to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: 'upload'
          app_location: 'client/dist'
          skip_api_build: true

      - name: Logout from Azure
        run: az logout
        if: always()
